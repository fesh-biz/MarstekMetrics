[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marstek-metrics"
version = "0.1.0"
description = "Моніторинг станцій Marstek Venus через локальний Open API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6-Essentials>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.scripts]
marstek-cli = "marstek_metrics.cli:main"

[project.gui-scripts]
marstek-metrics = "marstek_metrics.gui.app:main"

[tool.setuptools.packages.find]
include = ["marstek_metrics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
